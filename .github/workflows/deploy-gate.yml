name: Deployment Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "week-5/**"
      - "week-6/**"
      - ".github/workflows/deploy-gate.yml"
  push:
    branches:
      - main
    paths:
      - "week-5/**"
      - "week-6/**"
      - ".github/workflows/deploy-gate.yml"

permissions:
  contents: read

jobs:
  opentofu-checks:
    name: OpenTofu format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: week-5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Check formatting
        run: tofu fmt -check -diff

      - name: Initialize
        run: tofu init -backend=false -input=false

      - name: Validate
        run: tofu validate

  helm-checks:
    name: Render Prometheus chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v4.3.0

      - name: Render Prometheus chart
        run: |
          helm template prometheus prometheus \
            --repo https://prometheus-community.github.io/helm-charts \
            --version 29.35.0 \
            --namespace monitoring \
            -f week-6/prometheus-values.yaml \
            > /tmp/prometheus-rendered.yaml

      - name: Confirm manifests were rendered
        run: |
          test -s /tmp/prometheus-rendered.yaml
          grep -q '^kind:' /tmp/prometheus-rendered.yaml
          echo "Prometheus chart rendered successfully."
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov

      - name: Scan Kubernetes Terraform resources
        run: |
          checkov -d week-5 \
            --framework terraform \
            --check CKV_K8S_10,CKV_K8S_11,CKV_K8S_12,CKV_K8S_13,CKV_K8S_16,CKV_K8S_20
